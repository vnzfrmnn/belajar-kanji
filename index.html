<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplikasi belajar kanji JLPT N5/N4 untuk JFT - 200 kanji pertama">
  <meta name="theme-color" content="#4f46e5">
  <title>Belajar Kanji</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="header-title">Belajar Kanji</h1>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle tema">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <path class="sun-icon" d="M10 3v1m0 12v1m7-7h-1M4 10H3m13.66-5.66l-.71.71M6.05 14.95l-.71.71m9.32 0l-.71-.71M6.05 5.05l-.71-.71M14 10a4 4 0 11-8 0 4 4 0 018 0z"/>
          <path class="moon-icon" d="M17 10a7 7 0 11-12-4.9A5.5 5.5 0 0017 10z"/>
        </svg>
      </button>
    </header>

    <main id="main-content">
      <!-- Content rendered by JS -->
    </main>

    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          <path d="M9 22V12h6v10"/>
        </svg>
        <span>Beranda</span>
      </button>
      <button class="nav-btn" data-view="list">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
        <span>Daftar</span>
      </button>
      <button class="nav-btn" data-view="flashcard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <path d="M2 10h20"/>
        </svg>
        <span>Kartu</span>
      </button>
      <button class="nav-btn" data-view="quiz">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
          <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
        </svg>
        <span>Kuis</span>
      </button>
    </nav>
  </div>

  <script src="js/progress.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
